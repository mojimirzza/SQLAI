services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - itxn_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  agents:
    build: .
    env_file:
      - .env
    volumes:
      - itxn_data:/app/data
    command: ["python", "-m", "agent.main", "--loop", "15"]
    restart: unless-stopped

  sml-worker:
    build: .
    env_file:
      - .env
    volumes:
      - itxn_data:/app/data
    command: ["python", "-m", "sml.main", "--loop", "--interval-seconds", "60"]
    restart: unless-stopped

  sidecar-report:
    build: .
    env_file:
      - .env
    volumes:
      - itxn_data:/app/data
    command: ["python", "-m", "sidecar.main", "--mode", "report"]
    restart: "no"

volumes:
  itxn_data:
